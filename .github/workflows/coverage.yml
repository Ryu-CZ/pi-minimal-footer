name: Extension coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - uses: actions/github-script@v7
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const { owner, repo } = context.repo;
            // Do not let an older run replace coverage for a newer main commit.
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) return;
            let parent;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: 'heads/coverage' });
              parent = data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: tree } = await github.rest.git.createTree({
              owner, repo,
              tree: [{ path: 'badge.svg', mode: '100644', type: 'blob', content: await readFile('coverage.svg', 'utf8') }],
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, tree: tree.sha,
              message: `Update coverage for ${context.sha}`,
              parents: parent ? [parent] : [],
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/coverage', sha: commit.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/coverage', sha: commit.sha });
            }
